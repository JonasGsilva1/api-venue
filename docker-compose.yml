version: '3.8'

services:
  # -------------------------------------------------------------
  # BACKEND API & DOCUMENTAÇÃO SWAGGER (Porta 8000)
  # -------------------------------------------------------------
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venue-api-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=*
      - DEV_TOKEN=dev-raiz-token-2026
      - AI_ENGINE_TIMEOUT_SEG=2.5
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # FRONT-END UI (Porta 3000)
  # -------------------------------------------------------------
  frontend-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venue-ui-front
    ports:
      - "3000:3000"
    environment:
      - PORT_FRONTEND=3000
      - VITE_API_BASE_URL=http://localhost:8000
    command: ["python3", "serve_front.py", "3000"]
    depends_on:
      - backend-api
