services:
  - type: web
    name: venue-api-gateway
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
      - key: DEV_TOKEN
        value: "dev-raiz-token-2026"
      - key: AI_ENGINE_TIMEOUT_SEG
        value: "2.5"
      - key: WINDOW_TIME_MIN
        value: "30"
      - key: DESLOCAMENTO_MEDIO_MIN
        value: "8"
