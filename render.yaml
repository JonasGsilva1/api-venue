services:
  # ---------------------------------------------------------------------------
  # VENUE INTELLIGENCE CORE & FRONT-END (MESMA URL NO RENDER)
  # - Front-End Web: https://<sua-url>.onrender.com/
  # - Documentação Swagger UI: https://<sua-url>.onrender.com/docs
  # - API Gateway: https://<sua-url>.onrender.com/api/v1/...
  # ---------------------------------------------------------------------------
  - type: web
    name: venue-intelligence
    runtime: python
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
      - key: DEV_TOKEN
        value: "dev-raiz-token-2026"
      - key: AI_ENGINE_TIMEOUT_SEG
        value: "2.5"
      - key: WINDOW_TIME_MIN
        value: "30"
      - key: DESLOCAMENTO_MEDIO_MIN
        value: "8"
